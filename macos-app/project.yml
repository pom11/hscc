# XcodeGen project spec for the HSCC macOS app.
#
# Generate the Xcode project reproducibly with:
#   brew install xcodegen
#   macos-app/scripts/generate.sh
#
# The app is a MENU-BAR-ONLY client of the existing HSCC API (LSUIElement = YES,
# no Dock icon). It reuses the iOS app's Sources/Shared files by path — there
# are no copied models, no second HTTP client, and no new backend endpoints.
# Part 2 (t_1143c19b) adds HSCCMacWidgets, a desktop WidgetKit extension that
# reuses the iOS widget views/providers by path too; both targets join the same
# App Group.
#
# The App Group is deliberately the SAME `group.com.hscc.ios` the iOS app and
# its widget use. It is a team-wide container, not an iOS-only one, and keeping
# one group means the operator's saved clusters are one store rather than two
# that silently drift. Bundle identifiers are the parallel `com.hscc.mac…`
# family; the group identifier is a container name, not a bundle id.

name: HSCCMac
options:
  bundleIdPrefix: com.hscc
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Sparkle 2 drives the in-app update check (t_2a1e5913): the app consumes the
# appcast the release path publishes at /macos/appcast.xml. Pinned exactly: an
# update framework is not a place for a floating minor version. The package also
# supplies the release tools (generate_keys / sign_update) after:
#   xcodebuild -project HSCCMac.xcodeproj -scheme HSCCMac \
#     -resolvePackageDependencies -derivedDataPath build/DerivedData
# They land in build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4

settings:
  base:
    # Same signing mechanism as ios-app/project.yml: export the team once and
    # it survives every regenerate. A team picked in the Xcode UI is lost on the
    # next `xcodegen generate`.
    DEVELOPMENT_TEAM: ${HSCC_DEVELOPMENT_TEAM}
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_EMIT_LOC_STRINGS: YES
    # Same derivation as the iOS spec: one prefix moves the bundle id and the
    # App Group together. Defaults keep the shipped com.hscc / group.com.hscc.ios.
    HSCC_BUNDLE_PREFIX: com.hscc
    HSCC_APP_GROUP: group.$(HSCC_BUNDLE_PREFIX).ios
    # Filled by the release path from `generate_keys -p`; the private key never
    # leaves the operator's login keychain. Empty in a dev build is expected.
    HSCC_SPARKLE_PUBLIC_KEY: ""

schemes:
  HSCCMac:
    build:
      targets:
        HSCCMac: all
        # The widget extension is embedded in the app; building it here keeps a
        # fresh checkout compiling both targets from the shared scheme.
        HSCCMacWidgets: [run, archive]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  HSCCMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # Explicit list, matching the iOS spec's discipline: a source added to the
      # folder but not here is never compiled, so it is obvious in review.
      - path: Sources/HSCCMac/HSCCMacApp.swift
      - path: Sources/HSCCMac/MenuBarLabel.swift
      - path: Sources/HSCCMac/DashboardMonitor.swift
      - path: Sources/HSCCMac/DashboardView.swift
      - path: Sources/HSCCMac/MacPreferences.swift
      - path: Sources/HSCCMac/MacSettingsView.swift
      # Sparkle 2 (t_2a1e5913): one SPUStandardUpdaterController owns daily
      # automatic checks, the manual menu/Settings check and the update badge.
      # App target only — the widget extension never updates itself.
      - path: Sources/HSCCMac/SparkleUpdater.swift
      # AppIcon + the monochrome MenuBarIcon template image. The app icon PNGs
      # are generated from ios-app/assets-master/*.svg by scripts/make_appicon.sh
      # (never hand-dropped); the menu bar H is an SVG asset with a template
      # rendering intent.
      - path: Sources/HSCCMac/Assets.xcassets
      # Shared cross-platform sources, reused BY PATH from the iOS app. No
      # copies: one decoder, one App Group store, one failover loop.
      - path: ../ios-app/Sources/Shared/SharedModels.swift
      - path: ../ios-app/Sources/Shared/SharedStore.swift
      - path: ../ios-app/Sources/Shared/WidgetDataClient.swift
      # "Test connection" here runs the same per-address probe as iOS: one row
      # per saved address, one overall line, one last-working update.
      - path: ../ios-app/Sources/Shared/ConnectionAddressProbe.swift
      - path: ../ios-app/Sources/Shared/ClusterNodeTally.swift
      - path: ../ios-app/Sources/Shared/CardsRunningProjection.swift
      # The one design system, so the menu bar app and the iOS widgets share
      # the black + #FF5722 palette and spacing rather than growing a second.
      - path: ../ios-app/Sources/HSCC/Views/Theme.swift
      # The existing cluster list + Keychain store. Reused, not re-implemented:
      # saved clusters, multiple addresses, automatic failover, and per-cluster
      # tokens keep exactly the behaviour the iOS app already ships.
      - path: ../ios-app/Sources/HSCC/SettingsStore.swift
      - path: ../ios-app/Sources/HSCC/KeychainStore.swift
      # The appearance registry (t_444519ae) and its editor, reused BY PATH:
      # one App Group blob and one set of controls for the iOS Settings screen,
      # the macOS Settings window and every widget.
      - path: ../ios-app/Sources/HSCC/WidgetSettingsStore.swift
      - path: ../ios-app/Sources/HSCC/Views/WidgetAppearanceView.swift
      - path: ../ios-app/Sources/HSCC/Views/WidgetSurfaceLabels.swift
      # SettingsStore clears the shared last-known read cache on a cluster
      # switch. Foundation-only.
      - path: ../ios-app/Sources/HSCC/StateCache.swift
    entitlements:
      path: Sources/HSCCMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Same team-wide container as the iOS app + its extensions. The desktop
        # widget extension reads the same connection settings.
        com.apple.security.application-groups:
          - $(HSCC_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HSCC_APP_GROUP)
    dependencies:
      # The desktop widgets ship inside the app bundle; WidgetKit discovers
      # them from the embedded extension.
      - target: HSCCMacWidgets
        embed: true
      # Sparkle 2 is linked into the app (the widget extension never updates
      # itself). The pinned package also provides sign_update at release time.
      - package: Sparkle
      # Settings writes call WidgetCenter, and WidgetSettingsStore reloads
      # timelines from the app process.
      - sdk: WidgetKit.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: HSCC
        # Release scripts pass MARKETING_VERSION/CURRENT_PROJECT_VERSION on the
        # xcodebuild command line; without these keys in the generated plist the
        # cask's version and the app's CFBundleShortVersionString would drift.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HSCCAppGroup: $(HSCC_APP_GROUP)
        # Sparkle 2: the feed the release path publishes and the PUBLIC EdDSA
        # key printed by `generate_keys`. The private key stays in the login
        # keychain; release.sh signs the zip with it and puts the signature in
        # the appcast. An empty key disables updates rather than trusting an
        # unverifiable feed.
        SUFeedURL: https://pom11.github.io/hscc/macos/appcast.xml
        SUPublicEDKey: $(HSCC_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        # Menu-bar-only: no Dock icon, no app switcher entry.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        # HTTP over Tailscale is the transport (same contract as iOS); ATS must
        # allow it or every read to the daemon is blocked.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HSCC_BUNDLE_PREFIX).mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Per-TARGET entitlement path, matching the iOS targets: the project-level
        # value alone is not enough once a generated project is inspected.
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCMac.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES

  # Desktop / Notification Center widgets (t_1143c19b, part 2).
  #
  # Every widget file is the iOS extension's own source, referenced BY PATH.
  # There is no duplicated view, provider, entity query or configuration
  # intent: the same six widgets ship on both platforms, and the few places
  # where WidgetKit differs (the accessory families do not exist on macOS)
  # are `#if os(iOS)` inside those files, not a second copy here.
  #
  # The App Group, keychain access group and Shared client are identical to
  # the app target, so the desktop tile reads the same saved clusters, the same
  # failover loop and the same last-known snapshots as the menu bar dropdown.
  HSCCMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # The shared @main WidgetBundle: Cluster, Monitor, Cards Running,
      # Kanban Monitor, Projects and Board Status.
      - path: ../ios-app/Sources/HSCCWidgets/HSCCWidgetsBundle.swift
      - path: ../ios-app/Sources/HSCCWidgets/ClusterWidget.swift
      - path: ../ios-app/Sources/HSCCWidgets/ClusterWidgetMetrics.swift
      - path: ../ios-app/Sources/HSCCWidgets/ClusterWidgetViews.swift
      - path: ../ios-app/Sources/HSCCWidgets/MonitorWidget.swift
      - path: ../ios-app/Sources/HSCCWidgets/MonitorViews.swift
      - path: ../ios-app/Sources/HSCCWidgets/ProjectsWidget.swift
      - path: ../ios-app/Sources/HSCCWidgets/CardsRunningWidget.swift
      - path: ../ios-app/Sources/HSCCWidgets/KanbanMonitorWidget.swift
      - path: ../ios-app/Sources/HSCCWidgets/BoardStatusWidget.swift
      - path: ../ios-app/Sources/HSCCWidgets/BoardStatusReading.swift
      # The one rendering-mode adapter (fullColor / accented / vibrant), shared
      # with the iOS extension rather than reimplemented for macOS.
      - path: ../ios-app/Sources/HSCCWidgets/WidgetRendering.swift
      # One data path: the same App Group store and WidgetDataClient (GET-only,
      # multi-address failover) the iOS widget and the menu bar app use.
      - path: ../ios-app/Sources/Shared/SharedModels.swift
      - path: ../ios-app/Sources/Shared/SharedStore.swift
      - path: ../ios-app/Sources/Shared/WidgetDataClient.swift
      - path: ../ios-app/Sources/Shared/ClusterNodeTally.swift
      - path: ../ios-app/Sources/Shared/CardsRunningProjection.swift
      # The one design system + WidgetStyle SwiftUI bridge.
      - path: ../ios-app/Sources/HSCC/Views/Theme.swift
    entitlements:
      path: Sources/HSCCMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(HSCC_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HSCC_APP_GROUP)
    info:
      path: Sources/HSCCMacWidgets/Info.plist
      properties:
        CFBundleDisplayName: HSCC Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HSCCAppGroup: $(HSCC_APP_GROUP)
        LSMinimumSystemVersion: "14.0"
        # WidgetKit discovers the extension through this point identifier.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Same plain-HTTP-over-Tailscale transport as the app and the iOS
        # widget; without this every read from the extension is blocked.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HSCC_BUNDLE_PREFIX).mac.widgets
        # Per-TARGET entitlement path, matching every other target.
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCMacWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
