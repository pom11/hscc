# 4-node cluster: 1 gateway + 3 workers (single family, load-balanced)
# Max capacity with one model family

name: basic-4-node
version: 1
cluster_size: 4
description: "Gateway + 3 workers, single model family behind one proxy. Max capacity."

orchestrator:
  recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-35b-a3b-nvfp4-vllm.yaml"
  tp: 1
  pp: 1

orchestrator_node: "192.0.2.10"

families:
  - name: general
    models:
      - recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-27b-fp8-vllm.yaml"
        tp: 1
        pp: 1
    nodes:
      - "192.0.2.11"
      - "192.0.2.12"
      - "192.0.2.13"
    proxy:
      port: 4001
