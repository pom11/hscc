<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- HSCC app icon — DARK appearance master.
       The app is dark-only now, so this is intentionally the same design as
       the default master: a solid black field with a flat #FF5722 block letter
       H. Full-bleed: iOS applies the home-screen mask.
       Measured geometry on the 1024 canvas: left bar x 254–346, right bar
       x 676–768, both y 241–745; crossbar x 346–676, y 447–539. -->
  <rect width="1024" height="1024" fill="#000000"/>
  <g fill="#FF5722">
    <rect x="254" y="241" width="92" height="504"/>
    <rect x="676" y="241" width="92" height="504"/>
    <rect x="346" y="447" width="330" height="92"/>
  </g>
</svg>
