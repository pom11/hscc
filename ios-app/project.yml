# XcodeGen project spec for the HSCC iOS app + its extensions.
#
# Generate the Xcode project reproducibly with:
#   brew install xcodegen
#   xcodegen generate
#
# See README.md for both build paths (xcodegen, or manual Xcode project).
#
# This spec drives the main app plus THREE app-extension targets:
#   * HSCCWidgets            — Home Screen cluster widget (systemSmall + systemMedium).
#   * HSCCLiveActivity       — the fleet-wake Live Activity (ActivityKit).
#   * HSCCLiveActivitySession— the session Live Activity (ActivityKit): a live
#                              mirror of a project's streaming session.
# All four targets share the App Group `group.com.hscc.ios` so the widget and
# Live Activities see the operator's connection settings and the cluster state.
#
# Note on Live Activity targets: a widget extension body can only contain ONE
# ActivityConfiguration, so each Live Activity attribute type gets its own
# extension target (HSCCLiveActivity = wake, HSCCLiveActivitySession = session).
#
# Sources are listed explicitly (not via a folder glob) so a source added
# without updating this file is easy to spot in review. The shared sources
# under Sources/Shared are compiled into EVERY target. Info.plist keys are
# generated from the `info` block below; a physical `Info.plist` is not
# required (XcodeGen emits one at build time).

name: HSCC
options:
  bundleIdPrefix: com.hscc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Signing team for ALL FOUR targets. The app and all three extensions each
    # need one — setting it on the app alone still fails the extensions with
    # "Signing for <target> requires a development team".
    #
    # Set it once in your environment before generating, and it survives every
    # `xcodegen generate` (a team picked in the Xcode UI does NOT — regenerating
    # overwrites the project):
    #
    #     export HSCC_DEVELOPMENT_TEAM=YOURTEAMID
    #     xcodegen generate
    #
    # Find your ID in Xcode > Settings > Accounts, or:
    #     security find-identity -v -p codesigning
    # A free personal team works for sideloading.
    DEVELOPMENT_TEAM: ${HSCC_DEVELOPMENT_TEAM}
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only (sideload onto owner's device)
    SWIFT_EMIT_LOC_STRINGS: YES

# Shared source files compiled into the app AND both extensions, so every
# surface reads the same settings / topology / cluster state. Each target's
# `sources` list includes the shared files it needs under Sources/Shared.

# Schemes — declared explicitly so the RUNNABLE one is unambiguous.
# Without this, Xcode auto-creates a scheme per target on open, including one
# for each app EXTENSION. Selecting a widget/Live Activity scheme and hitting
# Run gives "failed to launch or exited before the debugger could attach":
# an app-extension cannot be launched standalone, it only runs inside its host.
# Declaring HSCC here makes it a SHARED scheme (committed under
# xcshareddata/xcschemes), so it is present on a fresh clone and is the obvious
# thing to run.
schemes:
  HSCC:
    build:
      targets:
        HSCC: all
        HSCCWidgets: [run, archive]
        HSCCLiveActivity: [run, archive]
        HSCCLiveActivitySession: [run, archive]
    run:
      config: Debug
      # The extensions are embedded in the app; running the app runs them in
      # their real host process, which is the only way they can run at all.
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release


targets:
  HSCC:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Listed explicitly so a source added without updating this file is
      # obvious in review. Keep this list in sync with Sources/ (the build will
      # fail to compile if a referenced file is missing; a file here that isn't
      # listed is simply not compiled).
      - path: Sources/HSCC/HSCCApp.swift
      - path: Sources/HSCC/ContentView.swift
      - path: Sources/HSCC/HSCCClient.swift
      - path: Sources/HSCC/ConnectionMonitor.swift
      # Offline queue (t_42ba90d2): app-scoped, persisted outbound chat queue
      # flushed when ConnectionMonitor reports reachable again.
      - path: Sources/HSCC/OfflineSendQueue.swift
      # Notify-operator (t_0454eb56): pure differential engine + foreground
      # coordinator + one-time auth delegate.
      - path: Sources/HSCC/Notify/OperatorAlert.swift
      - path: Sources/HSCC/Notify/ObservedState+LastSeenState.swift
      - path: Sources/HSCC/Notify/NeedsOperatorNotifier.swift
      - path: Sources/HSCC/Notify/NotificationCoordinator.swift
      - path: Sources/HSCC/Notify/NotificationsAppDelegate.swift
      - path: Sources/HSCC/SessionStreamCursor.swift
      - path: Sources/HSCC/StreamConnectionError.swift
      - path: Sources/HSCC/SessionEvent.swift
      - path: Sources/HSCC/StreamingTranscript.swift
      - path: Sources/HSCC/SessionActivitySummary.swift
      - path: Sources/HSCC/SessionActivityDriver.swift
      - path: Sources/HSCC/Models.swift
      - path: Sources/HSCC/APIError.swift
      - path: Sources/HSCC/KeychainStore.swift
      - path: Sources/HSCC/SettingsStore.swift
      - path: Sources/HSCC/SetupQRCode.swift
      - path: Sources/HSCC/LiveActivityManager.swift
      - path: Sources/HSCC/Views/SettingsView.swift
      - path: Sources/HSCC/Views/QRScannerView.swift
      - path: Sources/HSCC/Views/Theme.swift
      - path: Sources/HSCC/Views/NodeTopologyView.swift
      - path: Sources/HSCC/Views/LoadState.swift
      - path: Sources/HSCC/Views/ClusterView.swift
      - path: Sources/HSCC/Views/FleetView.swift
      - path: Sources/HSCC/Views/CardsView.swift
      - path: Sources/HSCC/Views/MutationSupport.swift
      - path: Sources/HSCC/Views/OrchestratorChatView.swift
      - path: Sources/HSCC/Views/ChatStore.swift
      - path: Sources/HSCC/Views/StreamingChatStore.swift
      - path: Sources/HSCC/Views/StreamingChatView.swift
      - path: Sources/HSCC/Views/ComposerText.swift
      - path: Sources/HSCC/Views/StreamReplyWatcher.swift
      - path: Sources/HSCC/Views/SessionHistoryView.swift
      - path: Sources/HSCC/Views/AutodownView.swift
      - path: Sources/HSCC/Views/ProjectsView.swift
      - path: Sources/HSCC/Views/ProjectUnreadCenter.swift
      - path: Sources/HSCC/Views/ProfileEditorView.swift
      - path: Sources/HSCC/Views/OpsView.swift
      - path: Sources/HSCC/Views/LogsView.swift
      - path: Sources/HSCC/Views/LogRedactor.swift
      - path: Sources/HSCC/Views/BoardHygieneView.swift
      - path: Sources/HSCC/Views/ApprovalsView.swift
      - path: Sources/HSCC/Views/ApprovalBadge.swift
      - path: Sources/HSCC/Views/HealthCheckIndicator.swift
      - path: Sources/HSCC/Views/FleetControlView.swift
      - path: Sources/HSCC/Views/ServingControlView.swift
      - path: Sources/HSCC/Views/TemplatesView.swift
      - path: Sources/HSCC/Views/TemplateDetailView.swift
      - path: Sources/HSCC/Views/TemplateTopologyView.swift
      - path: Sources/HSCC/Views/SearchView.swift
      - path: Sources/HSCC/Views/SessionsView.swift
      - path: Sources/HSCC/Views/SlashCommandPalette.swift
      - path: Sources/HSCC/Views/ActivityFeedView.swift
      - path: Sources/HSCC/Views/MemoryView.swift
      - path: Sources/HSCC/Views/CreateCardSheet.swift
      - path: Sources/HSCC/Intents/IntentClient.swift
      - path: Sources/HSCC/Intents/ClusterStatusIntent.swift
      - path: Sources/HSCC/Intents/ReviewQueueIntent.swift
      - path: Sources/HSCC/Intents/ApprovalsIntent.swift
      - path: Sources/HSCC/Intents/CannedCard.swift
      - path: Sources/HSCC/Intents/AppShortcuts.swift
      - path: Sources/HSCC/Intents/ProjectIntents.swift
      # Shared cross-target sources (compiled into all three bundles).
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/ExtensionClient.swift
      - path: Sources/Shared/WakingActivity.swift
      - path: Sources/Shared/SessionActivity.swift
    entitlements:
      path: Sources/HSCC.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hscc.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.hscc.ios
    dependencies:
      - target: HSCCWidgets
        embed: true
      - target: HSCCLiveActivity
        embed: true
      - target: HSCCLiveActivitySession
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hscc.ios
        # Per-TARGET, not just project-level: XcodeGen emits the SDK default
        # ("1,2") into each target's build settings, which silently overrode the
        # project-level value and made every target iPad-capable. That is what
        # triggers "All interface orientations must be supported unless the app
        # requires full screen" — an iPad multitasking rule. This is an
        # iPhone-only sideload, so declare it where it actually applies.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # NOTE: do NOT redeclare NSCameraUsageDescription / NSAppTransportSecurity
        # as INFOPLIST_KEY_* here. This target has an explicit INFOPLIST_FILE;
        # XcodeGen regenerates it from the `info.properties` block below, so
        # those keys are declared THERE (single source of truth). Duplicating
        # them as INFOPLIST_KEY_* here risks drift — a future edit to one but
        # not the other silently splits the declaration.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCC.entitlements
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: HSCC
        UILaunchScreen: {}
        # Declared HERE, not as INFOPLIST_KEY_* build settings: this target has
        # an explicit INFOPLIST_FILE, and XcodeGen REGENERATES that file from
        # this block. A key hand-added to Sources/Info.plist survives only until
        # the next generate.sh run, then vanishes silently.
        # ActivityKit refuses to start any Live Activity without this key —
        # Activity.request throws and areActivitiesEnabled reports false.
        NSSupportsLiveActivities: true
        # The camera is used ONLY to scan the setup QR code from `hscc api
        # status`. Without this key iOS kills the app the instant the scanner
        # opens — which is the first thing an operator does.
        NSCameraUsageDescription: HSCC uses the camera only to scan the setup QR code from `hscc api status`, so you do not have to type a tailnet address and a 43-character token by hand.
        # Declared explicitly: with no orientation keys Xcode warns "All
        # interface orientations must be supported unless the app requires
        # full screen". This is an iPhone-only console
        # (TARGETED_DEVICE_FAMILY 1); portrait is the primary layout and both
        # landscapes are useful for reading chat transcripts and log lines.
        # Upside-down is omitted, as Apple's own iPhone templates do.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # HTTP is fine — Tailscale provides the encrypted transport (design
          # §D rules TLS out of scope). Do NOT add pinning/cert handling.
          NSAllowsArbitraryLoads: true

  # Home Screen cluster widget — small (state + compact topology glyph) and
  # medium (topology pairs + model count + idle-minutes remaining).
  HSCCWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/HSCCWidgets/HSCCWidgetsBundle.swift
      - path: Sources/HSCCWidgets/ClusterWidget.swift
      - path: Sources/HSCCWidgets/ClusterWidgetViews.swift
      # Shared source files compiled into every target.
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/ExtensionClient.swift
      # Theme tokens shared with the app (design-system palette, no raw hex).
      - path: Sources/HSCC/Views/Theme.swift
    entitlements:
      path: Sources/HSCCWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hscc.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.hscc.ios
    info:
      path: Sources/HSCCWidgets/Info.plist
      properties:
        # A display name so the widget gallery / Home Screen shows a friendly
        # label instead of the raw target identifier "HSCCWidgets".
        CFBundleDisplayName: HSCC Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hscc.ios.widgets
        # Per-TARGET, not just project-level: XcodeGen emits the SDK default
        # ("1,2") into each target's build settings, which silently overrode the
        # project-level value and made every target iPad-capable. That is what
        # triggers "All interface orientations must be supported unless the app
        # requires full screen" — an iPad multitasking rule. This is an
        # iPhone-only sideload, so declare it where it actually applies.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCWidgets.entitlements
        SKIP_INSTALL: YES
        # Widgets must include their own app-group entitlement; extension
        # products must not copy the main app's framework (there is none).
    dependencies:
      - sdk: WidgetKit.framework

  # Fleet-wake Live Activity (ActivityKit) — the app starts it via
  # `LiveActivityManager`; this extension renders the ActivityConfiguration.
  HSCCLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/HSCCLiveActivity/HSCCLiveActivity.swift
      # Shared source files compiled into every target.
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/WakingActivity.swift
      # Theme tokens shared with the app (design-system, no raw hex here).
      - path: Sources/HSCC/Views/Theme.swift
    entitlements:
      path: Sources/HSCCLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hscc.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.hscc.ios
    info:
      path: Sources/HSCCLiveActivity/Info.plist
      properties:
        # A display name so the Live Activity / Lock Screen surfaces a friendly
        # label instead of the raw target identifier "HSCCLiveActivity".
        CFBundleDisplayName: HSCC Live Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hscc.ios.liveactivity
        # Per-TARGET, not just project-level: XcodeGen emits the SDK default
        # ("1,2") into each target's build settings, which silently overrode the
        # project-level value and made every target iPad-capable. That is what
        # triggers "All interface orientations must be supported unless the app
        # requires full screen" — an iPad multitasking rule. This is an
        # iPhone-only sideload, so declare it where it actually applies.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCLiveActivity.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework

  # Session Live Activity (ActivityKit) — the LIVE mirror of a project's
  # streaming session on the Lock Screen / Dynamic Island. The app drives it
  # via `SessionActivityDriver` (fed by StreamingTranscript/StreamingChatStore
  # folding the session event stream); this extension renders the
  # ActivityConfiguration for `SessionActivityAttributes`.
  #
  # SEPARATE target from HSCCLiveActivity: a widget extension body can only
  # contain ONE ActivityConfiguration, so each Live Activity attribute type
  # gets its own extension target.
  HSCCLiveActivitySession:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/HSCCLiveActivitySession/HSCCLiveActivitySession.swift
      # Shared source files compiled into every target.
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/SessionActivity.swift
      # Theme tokens shared with the app (design-system, no raw hex here).
      - path: Sources/HSCC/Views/Theme.swift
    entitlements:
      path: Sources/HSCCLiveActivitySession.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hscc.ios
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.hscc.ios
    info:
      path: Sources/HSCCLiveActivitySession/Info.plist
      properties:
        # A display name so the session Live Activity / Lock Screen surfaces a
        # friendly label instead of the raw target identifier "HSCCLiveActivitySession".
        CFBundleDisplayName: HSCC Session
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hscc.ios.liveactivity.session
        # Per-TARGET, not just project-level: XcodeGen emits the SDK default
        # ("1,2") into each target's build settings, which silently overrode the
        # project-level value and made every target iPad-capable. That is what
        # triggers "All interface orientations must be supported unless the app
        # requires full screen" — an iPad multitasking rule. This is an
        # iPhone-only sideload, so declare it where it actually applies.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCLiveActivitySession.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
