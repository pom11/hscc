# XcodeGen project spec for the HSCC iOS app + its extensions.
#
# Generate the Xcode project reproducibly with:
#   brew install xcodegen
#   xcodegen generate
#
# See README.md for both build paths (xcodegen, or manual Xcode project).
#
# This spec drives the main app plus TWO app-extension targets:
#   * HSCCWidgets              — the Home Screen widgets.
#   * HSCCLiveActivityMonitor  — Cluster watch (A2), the only Live Activity.
# All three targets share one App Group so the widgets and the Live Activity see
# the operator's connection settings and the cluster state. The group is DERIVED
# from the bundle-id prefix (`HSCC_BUNDLE_PREFIX`, default `com.hscc` for DEV
# builds) in one place below; every target, entitlement and Info.plist reads
# that derivation instead of naming a literal. The RELEASE path fixes the
# prefix to the identity 1.0.0 actually shipped — `ro.parsec.hscc`, because
# `group.com.hscc.ios` belongs to another team — and only an explicit override
# changes it:
#
#     HSCC_BUNDLE_PREFIX=dev.example ios-app/scripts/release_adhoc.sh 1.0.0
#
# Note on Live Activity targets: the one remaining activity (Cluster watch) is
# rendered by HSCCLiveActivityMonitor. The wake target and the other activity
# types were removed by the 2026-11-20 widget-redesign picks; the session
# activity left with the chat it mirrored (t_3b15b8c9, iOS pivot).
#
# Sources are listed explicitly (not via a folder glob) so a source added
# without updating this file is easy to spot in review. The shared sources
# under Sources/Shared are compiled into EVERY target: `SharedModels.swift`
# holds the Codable wire payloads, `SharedStore.swift` holds the App Group
# identifier and the typed stores (connection settings, widget/Live Activity
# configuration, last-known snapshots) the app writes and the extensions read.
# Info.plist keys are generated from the `info` block below; a physical
# `Info.plist` is not required (XcodeGen emits one at build time).

name: HSCC
options:
  bundleIdPrefix: com.hscc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Signing team for ALL FOUR targets. The app and all three extensions each
    # need one — setting it on the app alone still fails the extensions with
    # "Signing for <target> requires a development team".
    #
    # Set it once in your environment before generating, and it survives every
    # `xcodegen generate` (a team picked in the Xcode UI does NOT — regenerating
    # overwrites the project):
    #
    #     export HSCC_DEVELOPMENT_TEAM=YOURTEAMID
    #     xcodegen generate
    #
    # Find your ID in Xcode > Settings > Accounts, or:
    #     security find-identity -v -p codesigning
    # A free personal team works for sideloading.
    DEVELOPMENT_TEAM: ${HSCC_DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.4.2"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only (sideload onto owner's device)
    SWIFT_EMIT_LOC_STRINGS: YES
    # ONE source of truth for the reverse-DNS family. Product bundle ids are
    # `$(HSCC_BUNDLE_PREFIX).ios…` and the App Group is derived from the same
    # setting, so overriding this on the xcodebuild command line (or through
    # release_adhoc.sh's environment) moves all four targets together.
    HSCC_BUNDLE_PREFIX: com.hscc
    HSCC_APP_GROUP: group.$(HSCC_BUNDLE_PREFIX).ios

# Shared source files compiled into the app AND both extensions, so every
# surface reads the same settings / topology / cluster state. Each target's
# `sources` list includes the shared files it needs under Sources/Shared.

# Schemes — declared explicitly so the RUNNABLE one is unambiguous.
# Without this, Xcode auto-creates a scheme per target on open, including one
# for each app EXTENSION. Selecting a widget/Live Activity scheme and hitting
# Run gives "failed to launch or exited before the debugger could attach":
# an app-extension cannot be launched standalone, it only runs inside its host.
# Declaring HSCC here makes it a SHARED scheme (committed under
# xcshareddata/xcschemes), so it is present on a fresh clone and is the obvious
# thing to run.
schemes:
  HSCC:
    build:
      targets:
        HSCC: all
        HSCCWidgets: [run, archive]
        HSCCLiveActivityMonitor: [run, archive]
    run:
      config: Debug
      # The extensions are embedded in the app; running the app runs them in
      # their real host process, which is the only way they can run at all.
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release


targets:
  HSCC:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Listed explicitly so a source added without updating this file is
      # obvious in review. Keep this list in sync with Sources/ (the build will
      # fail to compile if a referenced file is missing; a file here that isn't
      # listed is simply not compiled).
      - path: Sources/HSCC/HSCCApp.swift
      # In-app update check (t_2a1e5913), APP TARGET ONLY. The release pipeline
      # publishes /ios/version.json; UpdateCheck.swift is the pure parse/order/
      # dismissal half and UpdateChecker.swift fetches it over its own short-
      # timeout URLSession (no token, never through the cluster). Neither file
      # is listed in HSCCWidgets / HSCCLiveActivityMonitor, and the extensions
      # must never gain a check: scripts/update_check.sh proves the file lists
      # stay that way.
      - path: Sources/HSCC/UpdateCheck.swift
      - path: Sources/HSCC/UpdateChecker.swift
      # Two-screen root (t_9664a1c8, pivot slice S1): the drawer shell (AppShell),
      # its rows (Sidebar) and the home dock (HomeView) are deleted with the
      # console; ConfigView is the only screen HSCCApp roots.
      - path: Sources/HSCC/Views/ConfigView.swift
      # Kept per CONSOLE_RETIREMENT §1.4 D4: its last consumer was the drawer
      # header, which went with the shell. Whether the root adopts the brand
      # mark is the operator's call, so the file stays compiled, not deleted.
      - path: Sources/HSCC/Views/HSCCMark.swift
      # Asset catalog (IOS_REDESIGN 2026-10-14 §7): the AppIcon set. Before this
      # the app shipped with NO catalog at all, which is why the home screen
      # showed the plain "H" placeholder. PNGs are generated by
      # scripts/make_appicon.sh from assets-master/*.svg and gated by
      # scripts/actool_icon_check.sh (build_check.sh is swiftc-only and would
      # never see a broken catalog).
      - path: Assets.xcassets
      - path: Sources/HSCC/DeepLink.swift
      - path: Sources/HSCC/HSCCClient.swift
      - path: Sources/HSCC/ConnectionMonitor.swift
      - path: Sources/HSCC/StateCache.swift
      # The offline outbound chat queue (t_42ba90d2) went with the chat family
      # in t_9d5a30c9 (CONSOLE_RETIREMENT §1.2 rule 2: the app keeps no actions,
      # §5 S2/S6): its only writer was ChatStore and its only gate was the
      # already-red offline_queue_check.sh, retired beside it.
      # The app delegate exists only for the Live Activities' BGTaskScheduler
      # registration and launch sweeps. The notification/APNs files that used
      # to sit in Notify/ were removed by the 2026-11-19 operator decision:
      # the apps carry no notifications, local or push.
      - path: Sources/HSCC/LaunchAppDelegate.swift
      # The session Live Activity's whole input path is gone. StreamingTranscript
      # went first (t_bd6e7c0a), then SessionActivitySummary +
      # SessionActivityDriver with the activity itself (t_3b15b8c9), then the
      # stream plumbing (SessionStreamCursor, StreamHello, StreamConnectionError)
      # and finally SessionEvent.swift itself (t_9d5a30c9, CONSOLE_RETIREMENT §5
      # S10 under D1b) — the last two consumers were StreamReplyWatcher and
      # `HSCCClient.sessionEvents`, both retired in this card. Nothing in the app
      # reads a project's event stream any more; `GET /v1/projects/{name}/session`
      # (the non-streaming history read) is S8's row, not this one.
      # Unit->node attribution for "Nodes & serving" (t_65d791da): the ONE place
      # that reads the live `sparkrun status` text out of /v1/cluster/hosts.
      # Headless-gated by scripts/serving_placement_check.sh.
      - path: Sources/HSCC/ServingPlacement.swift
      - path: Sources/HSCC/Models.swift
      - path: Sources/HSCC/APIError.swift
      - path: Sources/HSCC/KeychainStore.swift
      - path: Sources/HSCC/SettingsStore.swift
      - path: Sources/HSCC/WidgetSettingsStore.swift
      - path: Sources/HSCC/SetupQRCode.swift
      # Cluster watch (A2) — the one surviving Live Activity. The sweep runs at
      # launch; the driver is operator-started and owns the eight-hour budget,
      # the Active/cadence settings and the one BGAppRefreshTask identifier.
      - path: Sources/HSCC/ClusterHealthActivitySweep.swift
      - path: Sources/HSCC/ClusterHealthActivityDriver.swift
      # CarPlay scene (card W5g, design C "Rows with gauges"). The scene
      # delegate is named by the CPTemplateApplicationSceneSessionRoleApplication
      # block in this target's `info:` section. CarPlayReading.swift is
      # Foundation-only so scripts/carplay_check.sh compiles AND RUNS the copy,
      # thresholds and stale/offline rules; CarPlayImages.swift is the only file
      # that draws, and CarPlaySceneDelegate.swift owns the 30 s refresh.
      - path: Sources/HSCC/CarPlay/CarPlayReading.swift
      - path: Sources/HSCC/CarPlay/CarPlayImages.swift
      - path: Sources/HSCC/CarPlay/CarPlaySceneDelegate.swift
      # The running-cards projection the car screen's Running row and detail
      # list read. Shared with the widget/Live Activity so the same
      # `/v1/kanban/running` answer cannot produce two different longest cards.
      - path: Sources/Shared/CardsRunningProjection.swift
      - path: Sources/HSCC/Views/QRScannerView.swift
      - path: Sources/HSCC/Views/Theme.swift
      # The dismissible "Update <version> available" banner (t_2a1e5913),
      # rendered at the top of ConfigView. App target only, like its checker.
      - path: Sources/HSCC/Views/UpdateBanner.swift
      # Widget / Live Activity appearance editor (t_444519ae): the global style
      # plus a per-surface override, with the live small/medium/lock-screen
      # preview. The shared model lives in SharedStore.swift.
      - path: Sources/HSCC/Views/WidgetAppearanceView.swift
      # Surface names + row glyphs, shared with the macOS Settings window
      # (t_1143c19b) instead of a second copy of the same switches.
      - path: Sources/HSCC/Views/WidgetSurfaceLabels.swift
      - path: Sources/HSCC/Views/WidgetSurfaceLabels.generated.swift
      - path: Sources/HSCC/Views/NodeTopologyView.swift
      - path: Sources/HSCC/Views/LoadState.swift
      # ClusterView.swift retired as a screen (t_65d791da, spec §5 + §8): its
      # topology strip + fleet status line are now the header Section of
      # NodesServingView, so one screen answers "which machines are up" AND
      # "what runs on each of them". Its `.clusterHub` drawer row and destination
      # went with the shell collapse (t_9664a1c8), which deleted AppDestination.
      - path: Sources/HSCC/Views/NodesServingView.swift
      # Phase 2 shell (IOS_REDESIGN 2026-10-14 §3) had a drawer root for the
      # dock's Chat verb (ChatsRootView — a project list that pushed straight
      # into chat). It was already unreachable when t_9d5a30c9 retired it with
      # the rest of the chat family; the cross-board Cards root below survives.
      - path: Sources/HSCC/Views/CardsRootView.swift
      - path: Sources/HSCC/Views/FleetView.swift
      - path: Sources/HSCC/Views/CardsView.swift
      - path: Sources/HSCC/Views/MutationSupport.swift
      # The whole chat family is gone (t_9d5a30c9, CONSOLE_RETIREMENT §5 S2):
      # ChatStore + ChatEntry (the persisted transcript and its bubble
      # vocabulary), ComposerText (the composer's frozen copy), StreamReplyWatcher
      # (the 30 s poll that drove the unread badge) and ProjectUnreadCenter (the
      # badge's store). StreamingChatStore.swift + StreamingChatView.swift went
      # first (t_bd6e7c0a) and StreamPhase / ConnectionPhase with the session
      # Live Activity (t_3b15b8c9). Nothing writes a transcript any more, so
      # ProjectOverviewView lost its last-reply preview and ProjectsView its
      # unread badge in the same commit.
      - path: Sources/HSCC/Views/ProjectsView.swift
      - path: Sources/HSCC/Views/ProfileEditorView.swift
      - path: Sources/HSCC/Views/LogsView.swift
      - path: Sources/HSCC/Views/LogRedactor.swift
      # SelfHealHistoryView.swift retired (spec §8 merge into AutodownView);
      # AutodownView itself then retired with the console (t_0f3f70e6).
      - path: Sources/HSCC/Views/DisplayJSON.swift
      - path: Sources/HSCC/Views/AppliedTemplateStatus.swift
      - path: Sources/HSCC/Views/HealthCheckIndicator.swift
      # FleetControlView.swift retired (t_2a29a7ab, §8 row "FleetView ·
      # FleetControlView | drawer · Fleet (+ Control section)"): the applied-
      # template Section and the confirm-gated up/down MutationButtons moved
      # into FleetView verbatim; `.fleetControl` survives as a mapped alias
      # (the .selfHeal / .boardHygiene / .clusterHub precedent).
      - path: Sources/HSCC/FleetServing.swift
      # ServingControlView.swift was renamed and merged into NodesServingView
      # (t_65d791da) — listed above at ClusterView's old slot, since the new
      # screen is the union of both.
      - path: Sources/HSCC/Views/TemplatesView.swift
      - path: Sources/HSCC/Views/TemplateTopologyView.swift
      - path: Sources/HSCC/Views/SearchView.swift
      - path: Sources/HSCC/Views/SlashCommandPalette.swift
      - path: Sources/HSCC/Views/SlashCommandPreview.swift
      - path: Sources/HSCC/Views/ActivityFeedView.swift
      # Phase 3 cron roster (t_a2c8e456): read-only GET /v1/cron/list surface.
      - path: Sources/HSCC/Views/CronView.swift
      - path: Sources/HSCC/Views/CreateCardSheet.swift
      - path: Sources/HSCC/Intents/IntentClient.swift
      - path: Sources/HSCC/Intents/ClusterStatusIntent.swift
      - path: Sources/HSCC/Intents/CannedCard.swift
      - path: Sources/HSCC/Intents/AppShortcuts.swift
      - path: Sources/HSCC/Intents/WidgetScopePickerIntent.swift
      # Shared cross-target sources (compiled into all three bundles).
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/SharedStore.swift
      - path: Sources/Shared/WidgetSurfaceKind.generated.swift
      # Cluster watch (A2) attributes + its pure reading/orphan rules. The
      # rules are sliced by live_activity_rehydration_check.sh and executed
      # there, so this is the file the sweep and the extension's views share.
      - path: Sources/Shared/ClusterHealthActivity.swift
      # The board-status projection/reading rules, shared by the Boards widget
      # and its gates: one decoder for the same numbers, one snapshot store.
      - path: Sources/HSCCWidgets/BoardStatusReading.swift
      # The monitor host tally BOTH the cluster widget and the cluster-health
      # activity project through (t_f2867fb3), so one surface cannot call a
      # fleet degraded while the other calls it healthy. Foundation-only.
      - path: Sources/Shared/ClusterNodeTally.swift
      # Every column `hscc cluster monitor` prints, formatted the way the CLI
      # formats it (t_61ed3f5e), so a widget card draws strings instead of
      # re-deriving units and rounding. Foundation-only, which is what lets
      # `model_decode_check.sh` execute the parity check on macOS.
      - path: Sources/Shared/ClusterMonitorViewModel.swift
      # The chart projection for `GET /v1/cluster/history` (t_5ae8cfcf,
      # re-pointed at the canonical route by t_0c99b017): keeps a not-reported
      # metric a gap rather than a zero, and exposes each series' peak column
      # next to its average. Foundation-only.
      - path: Sources/Shared/ClusterHistoryTrend.swift
      # The graph widget's half of GET /v1/cluster/history (t_b6512c2e): the
      # metric set a widget may request (the recorder's own column names) and
      # the pixel-width reduction that keeps every column's min AND max, so a
      # sparkline cannot draw a peak the data never had. Foundation-only, which
      # is what lets scripts/cluster_history_chart_check.sh execute it on macOS.
      - path: Sources/Shared/ClusterHistorySeries.swift
      # The large / extra-large table layout (t_9e64d9d9): which columns and
      # rows the two biggest monitor surfaces draw, and the six fields only they
      # print. Foundation-only, so `model_decode_check.sh` can execute it.
      - path: Sources/Shared/ClusterMonitorTables.swift
      - path: Sources/Shared/WidgetDataClient.swift
      # The alert-feed wire types + projection ("Needs me", card R3). The client
      # names AlertsLite, so every target that compiles the client compiles this.
      - path: Sources/Shared/NeedsMeReading.swift
      # The merge-queue widget's wire types, CLI-shaped cells and last-known
      # snapshot (card MQ5). Named by `WidgetDataClient.mergeQueue()` above, so
      # every target that compiles the client compiles this too.
      - path: Sources/Shared/MergeQueueReading.swift
      # "Test connection" probes EVERY saved address (one row each) through
      # this shared implementation, so iOS and macOS report identically.
      - path: Sources/Shared/ConnectionAddressProbe.swift
    entitlements:
      path: Sources/HSCC.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HSCC_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HSCC_APP_GROUP)
        # No push entitlement: the app registers for neither remote nor local
        # notifications (operator decision 2026-11-19).
    dependencies:
      - target: HSCCWidgets
        embed: true
      - target: HSCCLiveActivityMonitor
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HSCC_BUNDLE_PREFIX).ios
        # The name of the AppIcon set inside Assets.xcassets (IOS_REDESIGN
        # 2026-10-14 §7). Without this the catalog compiles but xcodebuild does
        # not know which image set IS the app icon, and the home screen keeps
        # the "H" placeholder. scripts/actool_icon_check.sh proves the set
        # resolves (CFBundleIconName => AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Per-TARGET, not just project-level: XcodeGen emits the SDK default
        # ("1,2") into each target's build settings, which silently overrode the
        # project-level value and made every target iPad-capable. That is what
        # triggers "All interface orientations must be supported unless the app
        # requires full screen" — an iPad multitasking rule. This is an
        # iPhone-only sideload, so declare it where it actually applies.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # NOTE: do NOT redeclare NSCameraUsageDescription / NSAppTransportSecurity
        # as INFOPLIST_KEY_* here. This target has an explicit INFOPLIST_FILE;
        # XcodeGen regenerates it from the `info.properties` block below, so
        # those keys are declared THERE (single source of truth). Duplicating
        # them as INFOPLIST_KEY_* here risks drift — a future edit to one but
        # not the other silently splits the declaration.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCC.entitlements
        # CarPlay (card W5g). Apple has NOT granted HSCC a CarPlay entitlement,
        # so it must never reach a device/release signature. The simulator-only
        # file is selected by the SDK condition; `xcodebuild archive` for
        # `generic/platform=iOS` and the IPA keep the device value above,
        # byte-identically. scripts/carplay_check.sh proves both halves.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Sources/HSCC.simulator.entitlements
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: HSCC
        # The App Group every target reads at runtime (SharedStore.AppGroup).
        # Derived from HSCC_BUNDLE_PREFIX above; Xcode expands the build setting
        # into the final Info.plist, so Swift never names the group itself.
        HSCCAppGroup: $(HSCC_APP_GROUP)
        UILaunchScreen: {}
        # Dark-only app (operator request 2026-11-18): the black/orange palette
        # has no light variants. HSCCApp also pins preferredColorScheme(.dark);
        # this key covers launch chrome and any scene the system creates.
        UIUserInterfaceStyle: Dark
        # CarPlay (card W5g): the scene role Apple's template apps register for.
        # The delegate name is expanded from the app's module, so a custom
        # HSCC_BUNDLE_PREFIX or a debug build never points at the wrong class.
        # `UIApplicationSupportsMultipleScenes` stays true because the CarPlay
        # screen is a second scene alongside the phone's SwiftUI window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: HSCC CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # Deep links (t_136762f3): the `hscc://` URL scheme lets a notification,
        # a Telegram message, or a Mac session open a specific project, card or
        # session directly instead of starting from the root. CFBundleURLTypes
        # is what makes the system deliver those URLs to onOpenURL. The
        # CFBundleURLName is a reverse-DNS identifier, not a live network host.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.hscc.ios.deeplink
            CFBundleURLSchemes:
              - hscc
        # Handoff: the advertised NSUserActivity type. A Mac session can
        # continue a task on the phone (or vice versa) under this activity type.
        NSUserActivityTypes:
          - com.hscc.ios.open
        # Declared HERE, not as INFOPLIST_KEY_* build settings: this target has
        # an explicit INFOPLIST_FILE, and XcodeGen REGENERATES that file from
        # this block. A key hand-added to Sources/Info.plist survives only until
        # the next generate.sh run, then vanishes silently.
        # ActivityKit refuses to start any Live Activity without this key —
        # Activity.request throws and areActivitiesEnabled reports false.
        NSSupportsLiveActivities: true
        # Background refresh: Cluster watch is fed by the app, and when
        # backgrounded it uses BGAppRefreshTask to push data on a best-effort
        # OS schedule. iOS only allows scheduling task identifiers listed under
        # BGTaskSchedulerPermittedIdentifiers. The removed activities' three
        # identifiers went with their drivers.
        BGTaskSchedulerPermittedIdentifiers:
          - com.hscc.ios.clusterhealth.backgroundRefresh
        # The camera is used ONLY to scan the setup QR code from `hscc api
        # status`. Without this key iOS kills the app the instant the scanner
        # opens — which is the first thing an operator does.
        NSCameraUsageDescription: HSCC uses the camera only to scan the setup QR code from `hscc api status`, so you do not have to type a tailnet address and a 43-character token by hand.
        # Declared explicitly: with no orientation keys Xcode warns "All
        # interface orientations must be supported unless the app requires
        # full screen". This is an iPhone-only console
        # (TARGETED_DEVICE_FAMILY 1); portrait is the primary layout and both
        # landscapes are useful for reading chat transcripts and log lines.
        # Upside-down is omitted, as Apple's own iPhone templates do.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # HTTP is fine — Tailscale provides the encrypted transport (design
          # §D rules TLS out of scope). Do NOT add pinning/cert handling.
          NSAllowsArbitraryLoads: true

  # Home Screen cluster widget — small (state + compact topology glyph) and
  # medium (topology pairs + model count + idle-minutes remaining).
  HSCCWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/HSCCWidgets
      # The `systemMedium` CLI host table (t_2d1c12dc). Split in two on purpose:
      # the reading half is Foundation-only so `cluster_widget_check.sh` can
      # compile and RUN the column/cell/threshold rules against the fixture, and
      # the view half is the only file that names a Colour.
      # The systemSmall grid (t_9e110d88): the tile's data half on Foundation
      # only, so scripts/model_decode_check.sh compiles and RUNS the exact rows
      # the small widget draws (the SwiftUI half is ClusterSmallGridView.swift).
      # The host / serving tables and the XL detail block the large + extra-large
      # monitor surfaces draw (t_9e64d9d9). Shared by the cluster and monitor
      # widgets so the two tiles cannot drift apart.
      # Projects surface (small + medium + large), t_d739d163. Its configuration
      # intent and entity query live in the same file as the widget they configure.
      # Running cards with worker and age (`hscc cards monitor --live` on the
      # Home Screen), read through WidgetDataClient — see the file header.
      # `hscc kanban monitor --live`'s running / ready / blocked, read-only
      # through WidgetDataClient — see the file header.
      # todo/ready/running/blocked/done for ONE board (t_6d8731ab), read-only
      # through WidgetDataClient — see the file header.
      # The main orchestrator's alert feed ("Needs me", card R3): one read of
      # GET /v1/alerts through WidgetDataClient, projected by NeedsMeReading.swift.
      # The local merge queue (card MQ5): the per-project tables `hscc kanban
      # monitor` draws, read-only through WidgetDataClient. Its cells are the
      # CLI's own column strings, projected by MergeQueueReading.swift.
      # Rendering-mode adaptation (t_1143c19b): one shared palette swap for
      # WidgetKit's fullColor / accented / vibrant modes, used by the iOS
      # widgets and the macOS desktop extension alike.
      # The widget's count rules on Foundation only, so
      # scripts/board_status_widget_check.sh can compile and execute them.
      # The history graph widget (t_f4551339): Swift Charts over
      # `GET /v1/cluster/history`. Four files on purpose — the projection rules
      # live in `Sources/Shared/ClusterGraphReading.swift` (Foundation-only, so a
      # macOS harness executes them), the one `WidgetFamily` dependency in
      # `GraphWidgetMetrics.swift`, the entry and its last-known series in
      # `GraphWidgetEntry.swift`, and the configuration intent, provider and
      # `Widget` in `GraphWidget.swift`. Home-screen families only; the dispatch
      # gives each declared size its own arm.
      # Shared source files compiled into every target.
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/SharedStore.swift
      - path: Sources/Shared/WidgetSurfaceKind.generated.swift
      - path: Sources/Shared/WidgetDataClient.swift
      # The alert-feed projection and its last-known snapshot (card R3),
      # Foundation-only so the decode gate executes the same order/filter/age
      # rules the widget and the macOS dropdown draw.
      - path: Sources/Shared/NeedsMeReading.swift
      # The merge-queue widget's wire types + CLI cells + snapshot (MQ5),
      # Foundation-only so the decode gate executes the same projection.
      - path: Sources/Shared/MergeQueueReading.swift
      # `ClusterFleet`'s host tally IS this projection (t_f2867fb3) — the
      # cluster-health Live Activity runs the same call, so the widget and the
      # bubble cannot disagree about a fleet that is half down.
      - path: Sources/Shared/ClusterNodeTally.swift
      # Every column `hscc cluster monitor` prints, formatted the way the CLI
      # formats it (t_61ed3f5e), so a widget card draws strings instead of
      # re-deriving units and rounding. Foundation-only, which is what lets
      # `model_decode_check.sh` execute the parity check on macOS.
      - path: Sources/Shared/ClusterMonitorViewModel.swift
      - path: Sources/Shared/ClusterHistoryTrend.swift
      # The graph widget's half of GET /v1/cluster/history (t_b6512c2e): the
      # requestable metric set and the min/max-preserving pixel reduction.
      # Foundation-only, so the widget and the gate both execute the same file.
      - path: Sources/Shared/ClusterHistorySeries.swift
      # The large / extra-large table layout (t_9e64d9d9): which of the CLI's
      # columns and how many of its rows the two biggest monitor surfaces draw,
      # plus the six fields only they print (VRAM, GPU clock, net, uptime, fan,
      # load). Foundation-only for the same reason as the file above — the view
      # files import WidgetKit, and a layout rule no gate can run is a layout
      # rule that drifts.
      - path: Sources/Shared/ClusterMonitorTables.swift
      # The Lock Screen's four numbers (hottest temp, GPU load, fleet watts,
      # running/waiting), projected from that view-model and worded by one copy
      # rule the three accessory families share (t_314a3811). Foundation-only
      # for the same reason: `cluster_widget_check.sh` executes it.
      - path: Sources/Shared/ClusterLockScreen.swift
      # What each graph-widget size draws (t_f4551339): the density rules, the
      # per-node panel, the served-resolution sentence and the threshold bands.
      # Foundation-only for the same reason as the line above, and it is the
      # half `scripts/cluster_graph_check.sh` compiles and RUNS.
      - path: Sources/Shared/ClusterGraphReading.swift
      # The running-cards projection + last-known snapshot (t_71deac83): the
      # provider saves through it and the app's Live Activity driver reads the
      # same slot back, so it lives in Shared with one decoder.
      - path: Sources/Shared/CardsRunningProjection.swift
      # Theme tokens shared with the app (design-system palette, no raw hex).
      - path: Sources/HSCC/Views/Theme.swift
    entitlements:
      path: Sources/HSCCWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HSCC_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HSCC_APP_GROUP)
    info:
      path: Sources/HSCCWidgets/Info.plist
      properties:
        # A display name so the widget gallery / Home Screen shows a friendly
        # label instead of the raw target identifier "HSCCWidgets".
        CFBundleDisplayName: HSCC Widgets
        HSCCAppGroup: $(HSCC_APP_GROUP)
        # Same dark-only contract as the app (see the app's info block).
        UIUserInterfaceStyle: Dark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HSCC_BUNDLE_PREFIX).ios.widgets
        # Per-TARGET, not just project-level: XcodeGen emits the SDK default
        # ("1,2") into each target's build settings, which silently overrode the
        # project-level value and made every target iPad-capable. That is what
        # triggers "All interface orientations must be supported unless the app
        # requires full screen" — an iPad multitasking rule. This is an
        # iPhone-only sideload, so declare it where it actually applies.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCWidgets.entitlements
        SKIP_INSTALL: YES
        # Widgets must include their own app-group entitlement; extension
        # products must not copy the main app's framework (there is none).
    dependencies:
      - sdk: WidgetKit.framework

  # Cluster watch (A2) — the ONLY Live Activity.
  # Live Activities are PUSH-ONLY: the app (`ClusterHealthActivityDriver`) polls
  # GET /v1/autodown/status, GET /v1/cluster/monitor and GET /v1/daemon/host on
  # the settings cadence and pushes updates; this extension renders the
  # ActivityConfiguration. The wake, monitor, running-cards and board-progress
  # activities were removed by the 2026-11-20 widget-redesign picks.
  HSCCLiveActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # The extension's @main: a WidgetBundle with the one activity.
      - path: Sources/HSCCLiveActivityMonitor/HSCCLiveActivityMonitorBundle.swift
      # Cluster watch: renders the state the app pushed, never fetches.
      - path: Sources/HSCCLiveActivityMonitor/ClusterHealthLiveActivity.swift
      # Shared source files compiled into every target.
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/SharedStore.swift
      - path: Sources/Shared/WidgetSurfaceKind.generated.swift
      - path: Sources/Shared/ClusterHealthActivity.swift
      # Needed by the projection block inside the file above — the extension
      # renders the state the app pushed and never projects a payload itself,
      # but the attributes file now names this one. t_f2867fb3.
      - path: Sources/Shared/ClusterNodeTally.swift
      # Every column `hscc cluster monitor` prints, formatted the way the CLI
      # formats it (t_61ed3f5e), so a widget card draws strings instead of
      # re-deriving units and rounding. Foundation-only, which is what lets
      # `model_decode_check.sh` execute the parity check on macOS.
      - path: Sources/Shared/ClusterMonitorViewModel.swift
      # The graph widget's half of GET /v1/cluster/history (t_b6512c2e): the
      # requestable metric set and the min/max-preserving pixel reduction, so a
      # Live Activity trend line cannot draw a peak the recorder never stored.
      - path: Sources/Shared/ClusterHistorySeries.swift
      # The large / extra-large table layout (t_9e64d9d9): which columns and
      # rows the two biggest monitor surfaces draw, and the six fields only they
      # print. Foundation-only, so `model_decode_check.sh` can execute it.
      - path: Sources/Shared/ClusterMonitorTables.swift
      # Theme tokens shared with the app (design-system, no raw hex here).
      - path: Sources/HSCC/Views/Theme.swift
    entitlements:
      path: Sources/HSCCLiveActivityMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HSCC_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HSCC_APP_GROUP)
    info:
      path: Sources/HSCCLiveActivityMonitor/Info.plist
      properties:
        # A display name so the Live Activity / Lock Screen surfaces a friendly
        # label instead of the raw target identifier "HSCCLiveActivityMonitor".
        CFBundleDisplayName: HSCC Cluster watch
        HSCCAppGroup: $(HSCC_APP_GROUP)
        # Same dark-only contract as the app (see the app's info block).
        UIUserInterfaceStyle: Dark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HSCC_BUNDLE_PREFIX).ios.liveactivity.monitor
        # Per-TARGET, not just project-level (see sibling targets).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCLiveActivityMonitor.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework

