      - sdk: ActivityKit.framework

  # Monitor Live Activity (ActivityKit) — the monitor-family Live Activities.
  # Live Activities are PUSH-ONLY: the app (`MonitorActivityDriver`) polls
  # GET /v1/cluster/monitor + GET /v1/daemon/host on the settings cadence and
  # pushes updates; this extension renders the ActivityConfiguration for
  # `MonitorActivityAttributes`.
  #
  # It also renders the running-cards activity (t_f9cc34e0,
  # `CardsRunningLiveActivity`): one extension CAN host several Live Activity
  # types, one `ActivityConfiguration` each, which is why this target's `@main`
  # is `HSCCLiveActivityMonitorBundle` (a `WidgetBundle`). The wake activity
  # predates that finding and stays its own target.
  HSCCLiveActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # The extension's @main: a WidgetBundle over the activities below.
      - path: Sources/HSCCLiveActivityMonitor/HSCCLiveActivityMonitorBundle.swift
      - path: Sources/HSCCLiveActivityMonitor/MonitorLiveActivity.swift
      - path: Sources/HSCCLiveActivityMonitor/CardsRunningLiveActivity.swift
      # The cluster-health activity (t_0120475a): renders the state the app
      # pushed, never fetches.
      - path: Sources/HSCCLiveActivityMonitor/ClusterHealthLiveActivity.swift
      # The per-board progress activity (t_451cbe25): the four board counts the
      # app pushes, rendered from the shared reading rules.
      - path: Sources/HSCCLiveActivityMonitor/BoardProgressLiveActivity.swift
      # Shared source files compiled into every target.
      - path: Sources/Shared/SharedModels.swift
      - path: Sources/Shared/SharedStore.swift
      - path: Sources/Shared/MonitorActivity.swift
      - path: Sources/Shared/CardsRunningActivity.swift
      # The stored row type `RunningCardMetric(row:)` projects from. Foundation
      # only, so the extension can compile the one mapping without touching the
      # App Group store it also declares.
      - path: Sources/Shared/CardsRunningProjection.swift
      # The projection's failure vocabulary (`WidgetDataFailure`) is declared
      # here; Foundation/Security only, and the extension still never fetches.
      - path: Sources/Shared/WidgetDataClient.swift
      - path: Sources/Shared/ClusterHealthActivity.swift
      - path: Sources/Shared/BoardProgressActivity.swift
      # Needed by the projection block inside the file above — the extension
      # renders the state the app pushed and never projects a payload itself,
      # but the attributes file now names this one. t_f2867fb3.
      - path: Sources/Shared/ClusterNodeTally.swift
      # Every column `hscc cluster monitor` prints, formatted the way the CLI
      # formats it (t_61ed3f5e), so a widget card draws strings instead of
      # re-deriving units and rounding. Foundation-only, which is what lets
      # `model_decode_check.sh` execute the parity check on macOS.
      - path: Sources/Shared/ClusterMonitorViewModel.swift
      # Theme tokens shared with the app (design-system, no raw hex here).
      - path: Sources/HSCC/Views/Theme.swift
    entitlements:
      path: Sources/HSCCLiveActivityMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HSCC_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HSCC_APP_GROUP)
    info:
      path: Sources/HSCCLiveActivityMonitor/Info.plist
      properties:
        # A display name so the monitor Live Activity / Lock Screen surfaces a
        # friendly label instead of the raw target identifier "HSCCLiveActivityMonitor".
        CFBundleDisplayName: HSCC Monitor
        HSCCAppGroup: $(HSCC_APP_GROUP)
        # Same dark-only contract as the app (see the app's info block).
        UIUserInterfaceStyle: Dark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HSCC_BUNDLE_PREFIX).ios.liveactivity.monitor
        # Per-TARGET, not just project-level (see sibling targets).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HSCCLiveActivityMonitor.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework

