[pytest]
# HSCC is six INDEPENDENT plugins (some in hyphenated, non-importable dirs) whose
# per-dir conftests each put their own dir on sys.path and import modules bare.
# Run the suite via scripts/run_tests.sh (one pytest process per plugin dir) —
# a single root-level `pytest` collects all dirs together and a few tests fail
# on cross-dir sys.modules/sys.path collisions. norecursedirs keeps transient
# git worktrees and archived dead code out of collection regardless.
norecursedirs = .worktrees _archive .git *.egg-info .venv
