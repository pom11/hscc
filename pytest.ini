[pytest]
# HSCC is six INDEPENDENT plugins (some in hyphenated, non-importable dirs) whose
# per-dir conftests each put their own dir on sys.path and import modules bare.
# Run the suite via scripts/run_tests.sh (one pytest process per plugin dir) —
# a single root-level `pytest` collects all dirs together and a few tests fail
# on cross-dir sys.modules/sys.path collisions. norecursedirs keeps transient
# git worktrees and archived dead code out of collection regardless.
#
# One cross-dir trap IS handled here, by the repo-root conftest.py: a hyphenated
# dir holding an __init__.py is a Hermes plugin payload, not an importable
# package, and must not be collected as a Package (t_0c4989d7). That guard is
# the only thing a root-level run gets — the isolation rule above still stands.
norecursedirs = .worktrees _archive .git *.egg-info .venv

# Registered, not implied: an unregistered marker is a PytestUnknownMarkWarning
# today and a hard error tomorrow, and a marker that only warns is a marker whose
# deselection silently stops deselecting anything (t_b0bcc49c).
#
# `loadstress` marks the cases that pass on an idle box and fail on a loaded
# one — the whole flaky-teardown class this repo keeps hitting ("green locally,
# red in the gate"). scripts/run_tests.sh deselects them from EVERY normal leg
# (`-m "not loadstress"`) so no ordinary gate pays for them, and the leg that
# runs them is selectable but never part of the default roster:
#
#   HSCC_TEST_LEGS=loadstress bash scripts/run_tests.sh
#
# That leg re-runs the marked cases under bounded CPU pressure owned by
# scripts/load_burners.sh and fails if it selects nothing. See
# docs/testing/loadstress-leg.md for the measured load, the budgets and why the
# marked cases deliberately run in exactly one place.
markers =
    loadstress: load-sensitive case; runs only under scripts/loadstress_leg.py, and every ordinary leg deselects it
