# Flightdeck configuration -- example / seed copy.
#
# This file is a reference you can copy to ~/.flightdeck/config.yaml. It is NOT
# written to ~/.flightdeck by anything in this repo; seeding it is an operator
# action (or the result of `flightdeck init --apply`). Copy it with:
#
#     cp docs/config.example.yaml ~/.flightdeck/config.yaml
#
# The Telegram surface has been removed from flightdeck: the telegram group /
# topic settings and the MCP daemon URL that used to serve it were dropped, so
# this config no longer holds any connection-level settings. The file is a
# retained placeholder — flightdeck reads it only to keep the ~/.flightdeck
# home predictable; nothing in the code consumes settings from it today.
#
# This is deliberately separate from registry.yaml, which holds the project
# registry (see docs/registry.example.yaml).
