name: pytest-legs

# Server-side pytest gate for the 12-leg roster in scripts/run_tests.sh
# (t_23bf61f3).
#
# WHY. Before this file, the repo's only test gate appeared in NO workflow:
# `grep -rn run_tests .github/workflows/` matched nothing, and `gh pr checks 443`
# / `gh pr checks 446` each returned only `compile` (app-build-checks) and
# `guard` (address-guard). So a red leg could not block a merge — and "the gate
# ran and passed" was indistinguishable from "the gate was never run". Measured
# consequence: hscc-api/tests/test_contract_swift_routes.py was red on main for
# 1h40m (704f1cb8 #443 -> ce8e87f3 #452) with three PRs merged on top of it, and
# stopped being red only when the feature under test was deleted. That is the
# structural fact this file closes; whether anyone ran the suite locally is not
# observable from the repo and is not claimed either way.
#
# WHICH LEGS (decision 1). Full matrix on every PR is not free — the roster is
# ~25 min on a loaded Spark host (measured at 540f8a8b: hscc-bootstrap alone is
# 285 s), and a gate that makes every unrelated flake a merge blocker gets
# clicked through, which is worse than no gate. So:
#
#   pull_request  -> the legs the touched paths can break, decided by
#                    .github/scripts/decide_legs.sh +
#                    .github/scripts/leg_select.py. That map FAILS CLOSED: a
#                    path it cannot attribute widens to the whole suite, and
#                    every leg in DIRS is covered by a rule for its own
#                    directory (pinned by test_leg_select.py).
#   push to main  -> EVERY leg. This is the backstop for a wrong map: a
#                    selection bug on a PR becomes a visible red on main within
#                    minutes of merge instead of the next "clear the red" card.
#                    The push trigger is restricted to main so a PR does not pay
#                    for a second, identical run on every branch commit; the
#                    full-suite decision is made by decide_legs.sh and executed
#                    by its test, not just asserted in this comment.
#   dispatch      -> the operator's choice (`legs` input), else the full roster.
#
# COST. One job per leg, in PARALLEL (fail-fast: false), so wall time is the
# slowest selected leg rather than the sum of the roster, and the gate's duration
# does not grow with the roster. Only hscc_daemon runs on macOS (its module
# annotates select.kqueue at class scope; ubuntu died collecting it on the first
# run); every other leg uses ubuntu's much larger concurrent pool. The Python
# venv is cached on requirements.txt + requirements-ci.txt and each leg only
# installs into it on a cache miss. The measured wall time of the first
# full-suite run and of a single-leg PR run is reported in the PR and in
# docs/reports/t_23bf61f3-ci-pytest-leg.md.
#
# BLOCKING OR ADVISORY (decision 2). Same shape as address-guard.yml: one
# repository variable, not an edit to this file.
#
#   Settings -> Secrets and variables -> Actions -> Repository variables
#     HSCC_TESTS_ENFORCE unset, empty or "false" -> advisory: a red leg is a
#                                          warning annotation and the job stays
#                                          green (you see it, nothing blocks)
#     HSCC_TESTS_ENFORCE=true       -> the job goes RED on a failed leg
#                                      ("True"/"TRUE"/"1"/"yes" count too: a
#                                      variable named ENFORCE is never allowed to
#                                      fail OPEN on capitalisation)
#     a leg that could not run at all fails EITHER way — see leg_verdict.sh.
#
# CURRENT POSTURE — ENFORCED (t_1cb8686f decided it, t_56bd1fd2 executed it).
#
# `HSCC_TESTS_ENFORCE=true` is set as a repository variable and `main` requires
# exactly one check, `legs`, with `strict=false` and `enforce_admins=true`. A red
# test leg therefore fails its job, fails the aggregator, and blocks the merge —
# including for an admin, because the fleet's merge path IS the admin token and
# a required check that admins bypass would be decorative on the only path that
# merges (that is how #587 merged a red `hscc-roles` leg and #589 merged over it).
# Read the live state back rather than trusting this comment:
#
#   gh api repos/pom11/hscc/actions/variables --jq '.variables[] | "\(.name)=\(.value)"'
#   gh api repos/pom11/hscc/branches/main/protection --jq \
#     '{contexts:.required_status_checks.contexts,strict:.required_status_checks.strict,enforce_admins:.enforce_admins.enabled}'
#
# The flip waits on a green full roster by design: enforcing while a leg is red
# freezes every PR in the repo on somebody else's failure. The gate that let this
# one through was `legs: FULL SUITE (12)` -> `all selected legs green` with zero
# red-leg annotations at `94828d99`, and the block itself was proven by a
# throwaway branch with one `assert 1 == 0` (PR #605: `leg hscc-roles` red, `legs`
# red, `mergeStateStatus: BLOCKED` as the admin).
#
# REQUIRE `legs`, NEVER `leg *`. `decide_legs.sh` runs only the legs a change's
# paths can break, so a PR reports a SUBSET — measured 2 of 12 on PR #593 and 1 of
# 12 on PR #605. Required `leg *` therefore means ten checks that never report on
# such a head: permanently "expected", permanently blocking, nothing ever merges.
# `legs` is one stable name that aggregates `needs.[select,leg].result`, so it
# carries every selected leg's verdict and still fails when a leg could not run.
# Its context string is `legs` — "pytest-legs / legs" is only how the UI spells it.
#
# `strict=false` is deliberate. `strict=true` forces a rebase of every head before
# it can merge, and this repo merges several PRs a day. The stale-head risk strict
# exists to close is already covered from the other side: the push-to-main run of
# this workflow is the full roster, so a wrong selection map reddens main within
# minutes of merge instead of hiding behind a green PR (see the triggers below).
#
# TWO ESCAPE HATCHES, one command each — written here so nobody has to invent one
# under pressure. Both are reversible in the same breath:
#
#   gh api -X PATCH repos/pom11/hscc/actions/variables/HSCC_TESTS_ENFORCE -f value=false
#       -> legs go advisory again; re-run the leg and it is green with a ::warning::
#   gh api -X PUT repos/pom11/hscc/branches/main/protection \
#     -H "Accept: application/vnd.github+json" --input <protection-body.json>
#       -> same body with "enforce_admins": false, for one emergency merge; or
#          `DELETE .../branches/main/protection` to drop the gate entirely
#
# Note the second one goes through the whole-protection PUT: the dedicated
# `PUT .../protection/enforce_admins` route returned 404 when this was set, so the
# whole-protection write is the one that is known to work here.
#
# The variable does NOT bypass a harness failure. `leg_verdict.sh` reddens a leg
# that produced no summary, or exited with anything other than pytest's
# "some test failed" code, whatever ENFORCE says — a killed leg is not evidence
# that the tests passed. Only re-running fixes that.
#
# One consequence worth knowing before you open a PR from an old branch: a
# required check has to have REPORTED at the PR head. A head that predates this
# workflow can never report `legs`, so that PR sits "Expected" and BLOCKED until
# its branch is brought onto main. That is the intended reading — a head that far
# behind is not mergeable evidence — but it is not obvious from the checks page.
#
# Two facts carried over from address-guard.yml: a check is only selectable once
# it has run successfully in the repo within 7 days, and a workflow that triggers
# on push but NOT pull_request never runs on the PR head and leaves a PR
# permanently blocked — so keep BOTH triggers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      legs:
        description: "Space-separated legs to run (empty = decide from the diff; full roster on push)"
        required: false
        default: ""
      enforce:
        description: "Force the blocking posture for this run only (true = a red leg fails the job)"
        type: boolean
        required: false
        default: false
      alone_sweep:
        description: "After the legs, sweep hscc_daemon alone-vs-in-leg on this runner's own thin venv (advisory)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Only pull_request runs share a group. Every other event — push to main,
  # workflow_dispatch — is grouped on its own run id, which GitHub documents as
  # "guaranteed to be both unique and defined for the run", so two pushes are
  # never in one group and there is nothing for GitHub to replace.
  #
  # Why a shared group was not made safe by leaving cancel-in-progress at false
  # — that flag only protects a run already IN PROGRESS. GitHub keeps at most one
  # `pending` run per group (its default `queue` is `single`) — "any existing
  # `pending` job or workflow in the same concurrency group will be canceled and
  # the new queued job or workflow will take its place" (workflow-syntax,
  # `concurrency`). Measured on the posture this file made binding: PR #607
  # merged as 62c76fe3 at 11:50:01Z started push run 45019238106, main moved a
  # minute later, and that run finished completed/cancelled with 0 jobs — the
  # sha had no full-roster evidence at all, and nothing reported a failure.
  #
  # `queue: max` (up to 100 pending) is the rejected alternative: it queues the
  # backstop behind the roster ahead of it, still cancels past 100, and GitHub
  # refuses it together with the cancel-in-progress of true that PRs need.
  #
  # Cost, accepted knowingly: in a merge burst two full rosters run at once.
  # Per-sha evidence is the product this workflow exists to make.
  group: pytest-legs-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.decide.outputs.legs }}
      leg_count: ${{ steps.decide.outputs.leg_count }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The touched-path diff needs the merge base, so no shallow clone.
          fetch-depth: 0

      - name: Decide which legs this change must run
        id: decide
        # All dynamic values reach the shell through the environment, never
        # inlined into the script, so a branch name cannot inject commands.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_LEGS: ${{ github.event.inputs.legs }}
        run: bash .github/scripts/decide_legs.sh

      - name: Refuse a zero-leg selection
        # A matrix built from an empty list runs no job and would leave the gate
        # job green — the "green because nothing ran" failure this file closes.
        env:
          COUNT: ${{ steps.decide.outputs.leg_count }}
          MATRIX: ${{ steps.decide.outputs.matrix }}
        run: |
          set -euo pipefail
          echo "legs=${MATRIX}"
          if [ -z "${COUNT}" ] || [ "${COUNT}" -lt 1 ]; then
            echo "::error::the selector produced no legs; refusing to report green"
            exit 1
          fi

  leg:
    name: leg ${{ matrix.leg }}
    needs: select
    strategy:
      # One red leg must not hide the rest: every selected leg reports, and the
      # verdict for all of them is taken by the `legs` job below.
      fail-fast: false
      matrix:
        # Objects ({leg, os}), so this is `include`, not a named axis: a named
        # axis would make matrix.leg the whole object and leave matrix.os unset.
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    # Ubuntu by default (cheap, 20 concurrent slots); a leg selector marks the
    # ones whose tests need Darwin. The first ubuntu run measured hscc_daemon's
    # kqueue import failure; see leg_select.MACOS_LEGS.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scripts leg pins the pre-migration CHANGELOG.md from git history
          # (test_changelog_fragments.test_migration_is_lossless_on_the_live_changelog).
          # A depth-1 checkout has no such blob: the test then reconstructs HEAD's
          # pointer-only [Unreleased] and goes red on the runner while staying green
          # in a full local clone. Full history is needed only for that leg.
          # `1 || 0` (not `0 || 1`): GitHub expressions treat 0 as falsy.
          fetch-depth: ${{ matrix.leg != 'scripts' && 1 || 0 }}

      - uses: actions/setup-python@v5
        with:
          # 3.13, to match the sibling interpreter the dual-interpreter stamp
          # already runs the roster under (~/miniconda3/envs/p313) rather than
          # adding a third CPython posture nobody stamps. requirements-ci.txt
          # carries the test-only imports (and requirements.txt); hermes is
          # deliberately absent, so the hermes-gap probes SKIP and `-rs` prints
          # each reason in the leg log.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Restore the test venv
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-venv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('requirements.txt', 'requirements-ci.txt') }}

      - name: Build the test venv
        # Exact pins, so a dependency release cannot turn this gate red between
        # two unrelated PRs. Nothing here installs hermes; that is the point.
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-ci.txt
          .venv/bin/python -m pytest --version

      - name: Run leg ${{ matrix.leg }}
        # The exit code is decided by leg_verdict.sh, not by continue-on-error,
        # so the advisory switch cannot turn a "could not run" into a pass.
        env:
          LEG: ${{ matrix.leg }}
          ENFORCE: ${{ vars.HSCC_TESTS_ENFORCE }}
          FORCED_ENFORCE: ${{ github.event.inputs.enforce }}
          HSCC_TEST_PY: ${{ github.workspace }}/.venv/bin/python
        run: |
          # GitHub runs `bash -e`; the runner is EXPECTED to fail, so `-e` must
          # be off or rc=$? never executes (a red leg would become an opaque
          # step error with no verdict and no advisory branch).
          set +e
          set -uo pipefail
          log="${RUNNER_TEMP}/leg.log"
          # Leg names come from scripts/run_tests.sh's roster, never from user
          # text; HSCC_TEST_LEGS with an unknown name exits 64 before any leg.
          HSCC_TEST_LEGS="$LEG" \
          HSCC_LEG_HEARTBEAT_SECONDS=0 \
            bash scripts/run_tests.sh >"$log" 2>&1
          rc=$?
          cat "$log"

          {
            echo "### ${LEG}"
            sed -n '/━━━ Summary ━━━/,$p' "$log" || true
          } >>"$GITHUB_STEP_SUMMARY"

          bash .github/scripts/leg_verdict.sh "$rc" "$log"

  alone-sweep:
    name: alone-sweep
    # ADVISORY baseline of the alone-vs-in-leg agreement on the runner's OWN thin
    # venv (t_4447d736). The nightly gate on the host that carries both stamp
    # interpreters measures this property there; the CI venv is a third
    # environment and had never been swept (audit
    # docs/audits/daemon-alone-run-order-dependence_t_572b4856.md §11). Dispatch
    # only and advisory by default: promotion to a gate is that section's step 4,
    # and its precondition is a green leg on this posture, which §11 shows is not
    # there yet. A baseline nobody can re-take is a baseline nobody re-takes, which
    # is why this is a job in the file rather than a command in a comment.
    #
    # `needs: leg` is what keeps the sweep's own rule — one pytest process per file
    # over one checkout, never alongside the leg it compares against. It runs after
    # the whole matrix, and it is `always()` on purpose: a red leg is exactly the
    # run whose sweep record you want, and alone_sweep.sh already refuses to call a
    # verdict over a red leg (it prints the diff, then "the LEG ITSELF is red").
    needs: leg
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch'
          && github.event.inputs.alone_sweep == 'true' }}
    runs-on: macos-latest
    # The leg this job re-runs measured 205 s on the runner, plus 131 single-file
    # processes on the same venv. The ceiling turns a hung pytest into a red at 40
    # minutes instead of a 6-hour burn on CI's most expensive pool.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The SAME interpreter and pins the legs build: this job's whole point is
          # to measure the CI posture, so it must not introduce a fourth one.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Restore the test venv
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-venv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('requirements.txt', 'requirements-ci.txt') }}

      - name: Build the test venv
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-ci.txt
          .venv/bin/python -m pytest --version

      - name: Sweep hscc_daemon alone-vs-in-leg on the CI venv
        env:
          PY: ${{ github.workspace }}/.venv/bin/python
          LEG: hscc_daemon
          ENFORCE: ${{ vars.HSCC_TESTS_ENFORCE }}
          FORCED_ENFORCE: ${{ github.event.inputs.enforce }}
        run: |
          # Same `bash -e` trap as the leg step: the sweep is EXPECTED to exit 1
          # when the leg it swept is red, and without `set +e` the verdict script
          # below would never run.
          set +e
          set -uo pipefail
          out="${RUNNER_TEMP}/alone-sweep"
          log="${out}/sweep.log"
          mkdir -p "$out"
          bash docs/audits/support/t_572b4856/alone_sweep.sh "$PY" "$LEG" "$out" \
            >"$log" 2>&1
          rc=$?
          cat "$log"

          {
            echo "### alone-vs-in-leg sweep — ${LEG} (CI venv)"
            echo '```'
            grep -E "run_tests rc=|^# files swept|^RESULT:|^test_[a-z0-9_]+: in-leg" "$log"
            echo "alone runs rc 0: $(grep -lx 0 "$out"/rc/*.rc 2>/dev/null | wc -l | tr -d ' ') / $(ls "$out"/rc 2>/dev/null | wc -l | tr -d ' ')"
            echo '```'
            echo "_Full record: the \`sweep-${LEG}\` artifact (per-file junit xml, per-file logs, \`inleg.log\`)._"
          } >>"$GITHUB_STEP_SUMMARY"

          bash .github/scripts/sweep_verdict.sh "$rc" "$log"

      - name: Publish the sweep record
        # Advisory or not, the evidence has to outlive the run: the diff names the
        # files, but only the xml and the per-file -rs logs hold the reason pairs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-hscc_daemon
          path: ${{ runner.temp }}/alone-sweep
          if-no-files-found: warn
          retention-days: 14

  legs:
    name: legs
    # The stable check name branch protection types ("pytest-legs / legs").
    # Per-leg jobs are a matrix with dynamic names; this job is the one verdict
    # that says "every selected leg passed / was advisory-green".
    needs: [select, leg]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          LEG_RESULT: ${{ needs.leg.result }}
        run: |
          set -euo pipefail
          echo "select: ${SELECT_RESULT}"
          echo "leg matrix: ${LEG_RESULT}"
          if [ "${SELECT_RESULT}" != "success" ]; then
            echo "::error::leg selection did not complete — nothing trustworthy ran"
            exit 1
          fi
          if [ "${LEG_RESULT}" != "success" ]; then
            # leg_verdict.sh already turned an advisory test failure green; this
            # is reached only for an enforced red or a harness failure.
            echo "::error::at least one selected leg is red or could not run"
            exit 1
          fi
          echo "all selected legs green"
