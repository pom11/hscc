name: check-runtime-deps

# Watches the runtime dependencies HSCC installs into (hermes-agent, sparkrun)
# and opens a PR when a newer upstream release ships, requesting the cluster to
# verify compatibility before merge.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-runtime-deps
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream releases
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEP_PR_BODY_FILE: ${{ runner.temp }}/pr_body.md
        run: python3 .github/scripts/check_runtime_deps.py

      - name: Open / update PR
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # All dynamic values pass through the environment (never inlined into
          # the shell), so an upstream release tag cannot inject shell commands.
          BRANCH: ${{ steps.check.outputs.branch }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          BODY_FILE: ${{ runner.temp }}/pr_body.md
          REVIEWER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BASE="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"

          # Deterministic branch: reset from the current (default) branch each
          # run so the PR always reflects the latest versions.
          git checkout -B "$BRANCH"
          git add hscc-bootstrap/runtime-versions.json
          git commit -m "chore(deps): bump runtime versions — ${SUMMARY}"
          git push --force origin "$BRANCH"

          # Ensure the routing label exists (idempotent).
          gh label create needs-cluster-check \
            --color 1f6feb \
            --description "Runtime dep bump — cluster must verify before merge" \
            2>/dev/null || true

          TITLE="chore(deps): runtime bump — ${SUMMARY}"
          # Create the PR if none is open for this branch; otherwise the
          # force-push already updated the diff — just refresh title/body/label.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" \
              --body-file "$BODY_FILE" --add-label needs-cluster-check \
              --add-reviewer "$REVIEWER" || true
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "$TITLE" --body-file "$BODY_FILE" \
              --label needs-cluster-check --reviewer "$REVIEWER"
          fi
