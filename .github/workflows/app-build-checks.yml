name: app-build-checks

# Gates for the two Apple clients. Every offline `*_check.sh` in each app's
# scripts tree runs here, by glob, so a gate is wired the day its file lands.
# They compile only: nothing generates, signs, links or launches an app.
#
# The iOS project targets iOS 26, so the iOS compile + asset-catalog legs SKIP
# on a runner whose Xcode is older than that SDK. Skipping is announced and
# does not fail the job; the macOS legs run everywhere (macOS 14 deployment
# target), and every other iOS gate compiles against the macOS SDK.
#
# WHEN THE COMPILE RUNS (t_31679ad1). Measured 2026-11-25: this workflow ran the
# `compile` job on macos-latest for EVERY push and pull_request (9-27 min each)
# while the account's macOS pool held 5 running and 10 queued; PRs waited 30+ min
# for a runner, #792/#802/#722 all hit the merge queue's 1800 s CI-pending budget
# and nothing queue-merged for 4 h. A Python-only PR cannot affect the Apple
# clients, so the ubuntu `changes` job decides from the diff and the heavy steps
# live in `apple`, which is skipped when nothing Apple-related moved. A push to
# main always compiles: that is the backstop for a wrong touched-path decision.
# `compile` is the stable check name and now aggregates: green on a legitimate
# skip, red when the compile failed or did not run, or when the selector itself
# broke. Never green because nothing ran.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-build-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.decide.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The touched-path diff needs both commits, so no shallow clone.
          fetch-depth: 0

      - name: Decide whether the Apple build inputs moved
        id: decide
        # All dynamic values reach the shell through the environment, never
        # inlined into the script, so a branch name cannot inject commands.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/decide_app_build.sh

  apple:
    name: apple compile
    needs: changes
    # Skipped only when the ubuntu selector says the diff cannot affect the
    # Apple clients; `compile` below turns that skip into the required check.
    if: needs.changes.outputs.apps == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # merge_base_check.sh measures drift against origin/main and never
          # fetches; a shallow checkout would leave the ref unresolvable.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
          echo "iOS SDK:   $(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || echo unavailable)"

      - name: macOS compile gate
        run: bash macos-app/scripts/build_check.sh

      - name: macOS asset catalog gate
        run: bash macos-app/scripts/actool_icon_check.sh

      - name: macOS Sparkle wiring gate
        run: bash macos-app/scripts/update_check.sh

      # HSCCMacWidgets compiles the iOS widget sources by path, so the desktop
      # tile's density depends on two specs in two different projects agreeing.
      # Pure text — no SDK, no compile — so it runs on every macOS runner.
      - name: macOS widget parity gate
        run: bash macos-app/scripts/widget_parity_check.sh

      # DECISION-t_447cc7fc left the two Apple clients split across two history
      # routes, and a tile that charts history can pick the retired one with a
      # plausible line of code — it compiles, it decodes, it draws. This trips on
      # any Swift source under either Sources tree asking for a history path
      # other than /v1/cluster/history. Pure text — no SDK, no compile — so it
      # belongs next to the other text gates and runs on every PR.
      - name: canonical history-route guard
        run: bash ios-app/scripts/history_route_guard_check.sh

      - name: iOS compile gate
        run: |
          set +e
          ver=$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ -z "$ver" ]; then
            echo "::notice::No iphonesimulator SDK on this runner; iOS leg skipped."
            exit 0
          fi
          major="${ver%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::notice::iOS SDK $ver is below the project's iOS 26 deployment target; iOS leg skipped."
            exit 0
          fi
          bash ios-app/scripts/build_check.sh

      - name: iOS update-feed gate
        run: bash ios-app/scripts/update_check.sh

      - name: widget registry gate
        run: python3 ios-app/scripts/widget_registry.py --check

      # plist_drift_check.sh refuses to run without the generator whose output it
      # audits — it does not skip and announce itself, because an announced skip is
      # how the Info.plists drifted from project.yml across four releases. Whether
      # macos-latest happens to ship xcodegen is therefore not something this job
      # gets to be unsure about, so the step installs it if it is missing.
      - name: xcodegen for the plist-drift gate
        run: command -v xcodegen || brew install xcodegen

      # Run the rest of the offline gates by glob. The four exclusions read live
      # state or a live capture and cannot run on a runner; build_check.sh is
      # covered by the guarded compile steps above. Everything else — including
      # the widget gates that merged red while this workflow named only a few
      # files — runs here.
      - name: offline app gates (glob)
        run: |
          set -uo pipefail
          ios_ver=$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)
          ios_major="${ios_ver%%.*}"
          rc=0
          for script in ios-app/scripts/*_check.sh macos-app/scripts/*_check.sh; do
            case "$script" in
              ios-app/scripts/build_check.sh|macos-app/scripts/build_check.sh)
                echo "::notice::$script runs in the compile steps above"; continue ;;
              ios-app/scripts/monitor_activity_check.sh|ios-app/scripts/offline_cache_fix_check.sh)
                echo "::notice::$script needs the live API; not an offline gate"; continue ;;
              ios-app/scripts/live_decode_check.sh|ios-app/scripts/fleet_stats_render_check.sh)
                echo "::notice::$script needs a live capture (scripts/capture_live.sh); not an offline gate"; continue ;;
              ios-app/scripts/actool_icon_check.sh)
                if [ -z "$ios_major" ] || [ "$ios_major" -lt 26 ]; then
                  echo "::notice::$script skipped: no iOS 26 SDK on this runner"; continue
                fi ;;
            esac
            echo "::group::$script"
            if ! bash "$script"; then
              echo "::error file=$script::$script failed"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

  compile:
    name: compile
    # The stable check name. It reports on every PR — including the ones whose
    # heavy job was skipped — and it fails on anything it cannot vouch for.
    needs: [changes, apple]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APPS: ${{ needs.changes.outputs.apps }}
          APPLE_RESULT: ${{ needs.apple.result }}
        run: |
          set -euo pipefail
          echo "changes: ${CHANGES_RESULT} (apps=${APPS:-<unset>})"
          echo "apple: ${APPLE_RESULT}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::the touched-path selector did not complete — refusing to report a compile verdict"
            exit 1
          fi
          case "${APPS}" in
            true)
              if [ "${APPLE_RESULT}" != "success" ]; then
                echo "::error::Apple build inputs changed but the compile did not succeed (${APPLE_RESULT})"
                exit 1
              fi
              echo "Apple build inputs changed; compile passed"
              ;;
            false)
              if [ "${APPLE_RESULT}" != "skipped" ]; then
                echo "::error::the selector skipped the compile but the heavy job reported ${APPLE_RESULT}"
                exit 1
              fi
              echo "no Apple build input in the diff; compile skipped"
              ;;
            *)
              echo "::error::the selector produced no apps verdict (${APPS:-<unset>})"
              exit 1
              ;;
          esac
