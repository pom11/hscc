# 6-node: A3B-NVFP4 orchestrator + 5 workers serving 27B-FP8, load-balanced behind one proxy.
name: 6node-coding
version: 2
description: "6 nodes: orchestrator + 5 coding workers (27B-FP8). cluster_size=6."
orchestrator:
  recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-35b-a3b-nvfp4-vllm.yaml"
families:
  - name: coding
    models:
      - recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-27b-fp8-vllm.yaml"
    workers: all
    proxy: true
