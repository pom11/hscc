# 4-node: TWO DeepSeek-V4-Flash-0731 FP8 instances, each spanning 2 nodes (tp=2).
# The orchestrator DSV4 claims the gateway node + 1 worker; a `reasoning` family
# runs a second DSV4 across the remaining 2 workers. All-DeepSeek, no coding tier.
#
# Uses the WORKING FP8 stack (proven 2026-08-04): FP8 checkpoint + scitrera-hscc
# container. DSV4 fp8 tp=2 = 80.40 GB/GPU (sparkrun show), fits every GB10.
# Requires the multi-node-tp resolver (orchestrator + family node spanning) that
# shipped on main. Weights (deepseek-ai/DeepSeek-V4-Flash-0731) must be staged
# node-local on all 4 nodes and the scitrera-hscc image built on each.
#
# ROUTING (v3): delegated subagents and kanban worker traffic are routed to the
# SECOND DSV4 — the `reasoning` family, served behind its proxy on :4000, which
# now advertises `worker-model`. Delegated work belongs on the worker pool, not
# the orchestrator's GPU. Compaction and the text auxiliaries stay on the
# orchestrator so a big summarization prompt never competes with worker
# throughput.
#
# This template deliberately declares NO explicit `nodes:` — it ships as part of
# a reusable 1-8 node library, and hardcoding this cluster's IPs would break it
# for every other deployment. Placement stays inferred (`workers: remaining`);
# the resolver bug that made inference unreliable was fixed in t_16dcceb4.
# `routing:` is symbolic and therefore portable, which is why it is safe to ship.
name: 4node-dual-dsv4
version: 3
description: "4 nodes: 2x DeepSeek-V4-Flash-0731 FP8 (each tp=2) — orchestrator DSV4 + reasoning family DSV4. cluster_size=4."
orchestrator:
  recipe: "~/.sparkrun-local/recipes/local-fixed/deepseek-v4-fp8-scitrera-hscc.yaml"
  tp: 2
families:
  - name: reasoning
    models:
      - recipe: "~/.sparkrun-local/recipes/local-fixed/deepseek-v4-fp8-scitrera-hscc.yaml"
        tp: 2
    workers: remaining
    proxy: true
routing:
  delegation: family-reasoning
  compaction: orchestrator
  auxiliaries: orchestrator
