# 3-node: A3B-NVFP4 orchestrator + 2 workers serving 27B-FP8, load-balanced behind one proxy.
name: 3node-coding
version: 2
description: "3 nodes: orchestrator + 2 coding workers (27B-FP8). cluster_size=3."
orchestrator:
  recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-35b-a3b-nvfp4-vllm.yaml"
families:
  - name: coding
    models:
      - recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-27b-fp8-vllm.yaml"
    workers: all
    proxy: true
