# 2-node: A3B-NVFP4 orchestrator + 1 worker serving 27B-FP8 (60.75 GB/GPU), behind a proxy.
name: 2node-coding
version: 2
description: "2 nodes: orchestrator + 1 coding worker (27B-FP8). cluster_size=2."
orchestrator:
  recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-35b-a3b-nvfp4-vllm.yaml"
families:
  - name: coding
    models:
      - recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-27b-fp8-vllm.yaml"
    workers: all
    proxy: true
