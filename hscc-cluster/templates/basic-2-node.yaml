# 2-node cluster: 1 gateway + 1 worker (single family)
# Simple setup: all worker models behind one proxy

name: basic-2-node
version: 1
cluster_size: 2
description: "Gateway + 1 worker, single model family behind one proxy."

orchestrator:
  recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-35b-a3b-nvfp4-vllm.yaml"
  tp: 1
  pp: 1

orchestrator_node: "192.0.2.10"

families:
  - name: general
    models:
      - recipe: "~/.sparkrun-local/recipes/local-fixed/qwen3.6-27b-fp8-vllm.yaml"
        tp: 1
        pp: 1
    nodes:
      - "192.0.2.11"
    proxy:
      port: 4001
